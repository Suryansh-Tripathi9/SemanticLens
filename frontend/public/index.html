<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <meta
    name="description"
    content="SemanticLens — AI-powered desktop file search with semantic understanding"
  />
  <title>SemanticLens — Intelligent Semantic File Explorer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            'inter': ['Inter', 'sans-serif'],
            'mono': ['JetBrains Mono', 'monospace']
          },
          colors: {
            'neon': {
              50: '#f0fdfa',
              100: '#ccfbf1',
              200: '#99f6e4',
              300: '#5eead4',
              400: '#2dd4bf',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              800: '#075985',
              900: '#0c4a6e'
            },
            'electric': {
              50: '#f0f9ff',
              100: '#e0f2fe',
              200: '#bae6fd',
              300: '#7dd3fc',
              400: '#38bdf8',
              500: '#0284c7',
              600: '#0369a1',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a'
            },
            'cyber': {
              50: '#f5f3ff',
              100: '#ede9fe',
              200: '#ddd6fe',
              300: '#c4b5fd',
              400: '#a78bfa',
              500: '#8b5cf6',
              600: '#7c3aed',
              700: '#6d28d9',
              800: '#5b21b6',
              900: '#4c1d95'
            }
          },
          animation: {
            'pulse-glow': 'pulse-glow 2.5s ease-in-out infinite',
            'fade-in': 'fade-in 0.25s ease-in-out',
            'neon-pulse': 'neon-pulse 2.5s ease-in-out infinite',
            'float': 'float 3s ease-in-out infinite',
          },
          keyframes: {
            'pulse-glow': {
              '0%, 100%': { boxShadow: '0 0 15px rgba(99, 102, 241, 0.4), 0 0 30px rgba(14, 165, 233, 0.2)' },
              '50%': { boxShadow: '0 0 25px rgba(99, 102, 241, 0.6), 0 0 45px rgba(14, 165, 233, 0.35)' }
            },
            'neon-pulse': {
              '0%, 100%': { boxShadow: '0 0 8px rgba(99, 102, 241, 0.25)' },
              '50%': { boxShadow: '0 0 18px rgba(99, 102, 241, 0.45)' }
            },
            'float': {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-6px)' }
            },
            'fade-in': {
              '0%': { opacity: '0', transform: 'translateY(6px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            }
          }
        }
      }
    }
  </script>
  <style>
    /* Prevent flash of unstyled content */
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background-color 0.3s ease;
    }
    
    body.light {
      background-color: #f8fafc;
    }
    
    body.dark {
      background-color: #0b0f19;
    }
    
    #root {
      height: 100vh;
    }
    
    /* Loading animation */
    .loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      transition: background-color 0.3s ease;
    }
    
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(99, 102, 241, 0.15);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    body.light .loading {
      background-color: #f8fafc;
      color: #0f172a;
    }
    
    body.dark .loading {
      background-color: #0b0f19;
      color: #f8fafc;
    }
  </style>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root">
    <div class="loading">
      <div class="spinner"></div>
      <div style="font-weight: 500; font-size: 14px; letter-spacing: 0.02em; opacity: 0.85;">Initializing SemanticLens...</div>
    </div>
  </div>
  <script>
    // Initialize theme on page load
    const savedTheme = localStorage.getItem('theme') || 'dark';
    if (savedTheme === 'dark') {
      document.documentElement.classList.add('dark');
      document.body.classList.add('dark');
    } else {
      document.body.classList.add('light');
    }
  </script>
</body>
</html>
